name: AR-002 PR CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: &runner blacksmith-4vcpu-ubuntu-2404

    strategy: &node-matrix
      matrix:
        node-version: [22.22.1]

    steps:
      - &checkout
        uses: actions/checkout@v6
      - &setup-node
        name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - &install-pnpm
        name: Install pnpm dependencies
        uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: true
      - name: Check coding styles and formatting
        run: pnpm lint

  web-build:
    name: Web Build
    runs-on: *runner
    strategy: *node-matrix

    steps:
      - *checkout
      - *setup-node
      - name: Cache Next.js build data
        uses: actions/cache@v5
        with:
          path: packages/web/.next/cache
          # Hash the checkout before pnpm adds node_modules to each package.
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('packages/web/**', 'packages/domain/**', 'packages/interface/**',
            'packages/typescript-config/**', 'turbo.json', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - *install-pnpm
      - name: Build web
        run: pnpm exec turbo run build --filter=web

  integration-tests:
    name: Integration Tests
    runs-on: *runner
    strategy: *node-matrix

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password_123
          MYSQL_DATABASE: clubs_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - *checkout
      - *setup-node
      - *install-pnpm

      - name: Build API
        run: pnpm build:api

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          NODE_ENV=test
          SERVER_PORT=3000
          SECRET_KEY=test_secret_key_for_ci
          ACCESS_TOKEN_SECRET_KEY=test_access_token_secret_for_ci
          REFRESH_TOKEN_SECRET_KEY=test_refresh_token_secret_for_ci
          TEST_DB_PORT=3307
          TEST_DB_PASSWORD=test_password_123
          TEST_DB_NAME=clubs_test
          TEST_DATABASE_URL=mysql://root:test_password_123@127.0.0.1:3307/clubs_test
          DATABASE_URL=mysql://root:test_password_123@127.0.0.1:3307/clubs_test
          EOF

      - name: Run database migrations
        run: |
          cd packages/api
          DATABASE_URL=mysql://root:test_password_123@127.0.0.1:3307/clubs_test \
          pnpm exec prisma db push --skip-generate

      - name: Run Integration tests
        run: |
          NODE_ENV=test \
          DATABASE_URL=mysql://root:test_password_123@127.0.0.1:3307/clubs_test \
          TEST_DATABASE_URL=mysql://root:test_password_123@127.0.0.1:3307/clubs_test \
          SERVER_PORT=3000 \
          SECRET_KEY=test_secret_key_for_ci \
          ACCESS_TOKEN_SECRET_KEY=test_access_token_secret_for_ci \
          REFRESH_TOKEN_SECRET_KEY=test_refresh_token_secret_for_ci \
          pnpm --filter api test:integration:ci
